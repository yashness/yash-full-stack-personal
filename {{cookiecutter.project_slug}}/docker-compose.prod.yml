# =============================================================================
# Production Docker Compose
# =============================================================================
# Production builds for local testing and cloud deployment.
# Runs completely standalone without /etc/hosts configuration.
#
# Usage:
#   # Start all services:
#   docker compose -f docker-compose.prod.yml up --build
#
#   # With external database (Neon/PostgreSQL):
#   docker compose -f docker-compose.prod.yml up --build frontend backend
#
# Access:
#   - Frontend: http://localhost:{{ cookiecutter.frontend_port }}
#   - Backend:  http://localhost:{{ cookiecutter.backend_port }}
#   - API Docs: http://localhost:{{ cookiecutter.backend_port }}/docs
# =============================================================================

services:
  {%- if cookiecutter.use_frontend %}
  # ---------------------------------------------------------------------------
  # Frontend - Next.js standalone
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "{{ cookiecutter.frontend_port }}:{{ cookiecutter.frontend_port }}"
    environment:
      - NODE_ENV=production
      # Use backend service name for internal Docker networking
      - NEXT_PUBLIC_API_URL=http://localhost:{{ cookiecutter.backend_port }}
      - BACKEND_INTERNAL_URL=http://backend:{{ cookiecutter.backend_port }}/api/v1
      # Clerk env vars (uncomment after running `bun run setup:clerk` in frontend)
      # - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:{{ cookiecutter.frontend_port }}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  {%- endif %}

  {%- if cookiecutter.use_backend %}
  # ---------------------------------------------------------------------------
  # Backend - FastAPI production
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "{{ cookiecutter.backend_port }}:{{ cookiecutter.backend_port }}"
    environment:
      - ENVIRONMENT=production
      - FRONTEND_URL=http://localhost:{{ cookiecutter.frontend_port }}
      # Database URL is loaded from .env file or use MySQL in Docker
      - DATABASE_URL=${DATABASE_URL:-mysql://user:password@db:3306/{{ cookiecutter.project_slug | replace('-', '_') }}}
    env_file:
      - ./backend/.env
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:{{ cookiecutter.backend_port }}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  {%- endif %}

  # ---------------------------------------------------------------------------
  # MySQL Database
  # ---------------------------------------------------------------------------
  # For production with external DB (Neon), skip this service and set DATABASE_URL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: {{ cookiecutter.project_slug | replace('-', '_') }}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
